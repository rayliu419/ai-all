  <text x="24" y="634" font-size="10.5" font-weight="600" class="t">图注：橙色编号对应 dsh 的扩展位（括号内是注册位置）</text>

  <g class="legT">
    <text x="24" y="660" font-size="10.5"><tspan font-weight="700" fill="#b45309">1</tspan>  <tspan class="mono" font-size="10px">sidebar.brand.mark / .name</tspan></text>
