    <text x="24" y="700" font-size="10.5"><tspan font-weight="700" fill="#b45309">2</tspan>  <tspan class="mono" font-size="10px">main</tspan>  keyed / root</text>
    <text x="40" y="716" class="legS mut">面板主体：main[key=dev-tasks]，id 必须与侧栏一致</text>

    <text x="24" y="740" font-size="10.5"><tspan font-weight="700" fill="#b45309">3</tspan>  <tspan class="mono" font-size="10px">sidebar.panellist</tspan>  list</text>
    <text x="40" y="756" class="legS mut">插件入口：id / label / order；角标用下一个槽位</text>

    <text x="24" y="780" font-size="10.5"><tspan font-weight="700" fill="#b45309">4</tspan>  <tspan class="mono" font-size="10px">sidebar.panellist.trailing</tspan></text>
    <text x="40" y="796" class="legS mut">行尾角标：待处理数 / 旧数据（非交互，收 wide + active）</text>

    <text x="604" y="660" font-size="10.5"><tspan font-weight="700" fill="#b45309">5</tspan>  <tspan class="mono" font-size="10px">sidebar.settings</tspan></text>
    <text x="620" y="676" class="legS mut">底部设置入口 → 配置中心（settings.section）</text>

    <text x="604" y="700" font-size="10.5"><tspan font-weight="700" fill="#b45309">6</tspan>  意图按钮 = <tspan class="mono" font-size="10px">IntentSpec</tspan></text>
    <text x="620" y="716" class="legS mut">同一份数据双注册：ctx.tools（agent 调）+ host route（人点）</text>

    <text x="604" y="740" font-size="10.5"><tspan font-weight="700" fill="#b45309">7</tspan>  五元信息 = run 投影</text>
    <text x="620" y="756" class="legS mut">one/run-* durable 事件 → projection → 卡片字段</text>

    <text x="604" y="780" font-size="10.5"><tspan font-weight="700" fill="#b45309">8</tspan>  流水线 = 8 系统聚合</text>
    <text x="620" y="796" class="legS mut">跨插件只读视图；实体对齐规则放 profile，不进 manifest</text>
  </g>
</svg>
