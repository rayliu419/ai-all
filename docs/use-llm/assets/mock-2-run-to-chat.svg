    <circle cx="940" cy="462" r="8" fill="#f59e0b"/><text x="940" y="465.5" text-anchor="middle" class="num">6</text>
    <circle cx="966" cy="132" r="8" fill="#f59e0b"/><text x="966" y="135.5" text-anchor="middle" class="num">7</text>
