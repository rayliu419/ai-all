<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="800" viewBox="0 0 1180 800" font-family="PingFang SC, Hiragino Sans GB, -apple-system, Segoe UI, sans-serif">
  <defs>
    <style>
      .mono { font-family: "SF Mono", Menlo, ui-monospace, monospace; }
