  <text x="992" y="266" font-size="9" class="mut">上下文哈希</text>
  <text x="992" y="282" font-size="9" class="mono" fill="#2d3a31">a3f9c1…</text>
  <text x="992" y="304" font-size="9" class="mut">技能</text>
  <text x="992" y="320" font-size="9" class="mono" fill="#2d3a31">dev-flow@v3</text>
  <text x="992" y="342" font-size="9" class="mut">状态</text>
  <rect x="992" y="350" width="70" height="16" rx="8" fill="#fde9d2"/>
  <text x="1027" y="362" font-size="9" text-anchor="middle" fill="#b45309">待人工确认</text>

  <!-- ===== annotation numbers ===== -->
  <g>
    <circle cx="452" cy="43" r="8" fill="#f59e0b"/><text x="452" y="46.5" text-anchor="middle" class="num">1</text>
    <circle cx="452" cy="82" r="8" fill="#f59e0b"/><text x="452" y="85.5" text-anchor="middle" class="num">2</text>
    <circle cx="452" cy="226" r="8" fill="#f59e0b"/><text x="452" y="229.5" text-anchor="middle" class="num">3</text>
