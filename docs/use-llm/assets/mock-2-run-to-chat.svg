  <!-- ===== legend ===== -->
  <line x1="24" y1="588" x2="1156" y2="588" stroke="#cddcd4"/>
  <text x="24" y="610" font-size="10.5" font-weight="600" class="t">图注：一键不是弹窗，是「跳进对话 + 上下文跟着过去」；每个橙色编号是一个 dsh 扩展位</text>

  <g>
    <text x="24" y="636" font-size="10.5"><tspan font-weight="700" fill="#b45309">1</tspan>  <tspan class="mono" font-size="10">conversation.session.header.actions</tspan>  list</text>
    <text x="40" y="652" class="legS mut">引用胶囊：ticket / CI / 时间 / 新鲜度，点回原卡</text>

    <text x="24" y="676" font-size="10.5"><tspan font-weight="700" fill="#b45309">2</tspan>  <tspan class="mono" font-size="10">conversation.view</tspan>  keyed</text>
    <text x="40" y="692" class="legS mut">视图目标：chat / trajectory / 看板；新增要配数据侧 View Definition</text>

    <text x="24" y="716" font-size="10.5"><tspan font-weight="700" fill="#b45309">3</tspan>  <tspan class="mono" font-size="10">conversation.chat.node</tspan>  keyed = one-run</text>
    <text x="40" y="732" class="legS mut">卡片由 ConversationNodeDefinition 从 one/run-* 事件折叠出来</text>

    <text x="24" y="756" font-size="10.5"><tspan font-weight="700" fill="#b45309">4</tspan>  <tspan class="mono" font-size="10">conversation.chat.turnTail</tspan></text>
    <text x="40" y="772" class="legS mut">出口按钮：patch / 状态回写 / 待办 / 继续问（没有出口就不算解决）</text>

    <text x="604" y="636" font-size="10.5"><tspan font-weight="700" fill="#b45309">5</tspan>  <tspan class="mono" font-size="10">tool.call.toolview</tspan>  keyed by 工具名</text>
    <text x="620" y="652" class="legS mut">工具调用卡片：diff / 日志 / 请求响应都长这样</text>

    <text x="604" y="676" font-size="10.5"><tspan font-weight="700" fill="#b45309">6</tspan>  <tspan class="mono" font-size="10">conversation.input.right</tspan></text>
    <text x="620" y="692" class="legS mut">输入区一键入口（可选，M4 之后）</text>

    <text x="604" y="716" font-size="10.5"><tspan font-weight="700" fill="#b45309">7</tspan>  <tspan class="mono" font-size="10">conversation.session.panel.section</tspan></text>
    <text x="620" y="732" class="legS mut">Session 详情面板：环境 / 本次 run / 技能版本 / 审批状态</text>

    <text x="604" y="762" font-size="10" class="dim">同一份 log 两个视图：这三张卡片不需要另建数据库</text>
  </g>
</svg>
