  </defs>

  <rect x="0" y="0" width="1180" height="800" fill="#eef4f0"/>

  <!-- ===== left: source card ===== -->
  <text x="20" y="52" font-size="11" font-weight="600" class="t">在看板上点一个意图</text>
  <rect x="20" y="64" width="300" height="212" rx="10" fill="#ffffff" stroke="#2a6a3e" stroke-width="1.4"/>
