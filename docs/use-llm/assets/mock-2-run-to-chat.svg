  <rect x="96" y="102" width="96" height="17" rx="4" fill="#eef4f0"/>
  <text x="144" y="114" font-size="9.5" text-anchor="middle" class="mut">15:43 · 旧数据 ⟳</text>

  <circle cx="36" cy="146" r="5" fill="#2a6a3e"/>
  <circle cx="74" cy="146" r="5" fill="#2a6a3e"/>
  <circle cx="112" cy="146" r="5" fill="#2a6a3e"/>
  <circle cx="150" cy="146" r="5" fill="#c2410c"/>
