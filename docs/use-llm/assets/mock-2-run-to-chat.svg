  <!-- arrow -->
  <line x1="326" y1="170" x2="352" y2="170" stroke="#2a6a3e" stroke-width="1.6"/>
  <path d="M352 170 l-8 -5 v10 z" fill="#2a6a3e"/>
  <text x="300" y="300" font-size="9.5" class="mut">点一下 = 新会话</text>
  <text x="300" y="318" font-size="9.5" class="dim">bundle 已装好，不需要复制粘贴</text>

  <!-- ===== right: conversation page ===== -->
  <rect x="470" y="20" width="690" height="540" rx="10" fill="#ffffff" stroke="#dbe7df"/>
  <line x1="470" y1="96" x2="1160" y2="96" stroke="#eef4f0"/>

  <!-- header: reference capsules -->
  <text x="486" y="46" font-size="11" font-weight="600" class="t">对话</text>
  <rect x="522" y="32" width="76" height="22" rx="11" fill="#e8f5ec" stroke="#b8d4c2"/>
  <text x="560" y="47" font-size="10" text-anchor="middle" fill="#2a6a3e">PEPS-5129</text>
  <rect x="604" y="32" width="40" height="22" rx="11" fill="#e8f5ec" stroke="#b8d4c2"/>
  <text x="624" y="47" font-size="10" text-anchor="middle" fill="#2a6a3e">CI</text>
  <rect x="650" y="32" width="66" height="22" rx="11" fill="#e8f5ec" stroke="#b8d4c2"/>
  <text x="683" y="47" font-size="10" text-anchor="middle" fill="#2a6a3e">15:43</text>
  <rect x="722" y="32" width="86" height="22" rx="11" fill="#fde9d2" stroke="#f0b072"/>
  <text x="765" y="47" font-size="10" text-anchor="middle" fill="#b45309">旧数据 ⟳</text>
  <text x="486" y="58" font-size="8.5" class="dim">点任一胶囊回到原卡片，滚动与筛选保持</text>

  <!-- view tabs -->
  <text x="486" y="82" font-size="11" font-weight="600" fill="#2a6a3e">对话</text>
  <line x1="486" y1="90" x2="510" y2="90" stroke="#2a6a3e" stroke-width="2"/>
  <text x="526" y="82" font-size="11" class="mut">轨迹</text>
  <text x="566" y="82" font-size="11" class="mut">看板</text>
  <text x="606" y="82" font-size="9" class="dim">← 第三方 View target</text>

  <!-- transcript -->
  <!-- user message -->
  <rect x="486" y="112" width="470" height="46" rx="8" fill="#f4f9f5"/>
  <text x="498" y="132" font-size="11.5" class="t">看看怎么修</text>
  <rect x="498" y="138" width="252" height="14" rx="7" fill="#ffffff" stroke="#cfe0d6"/>
  <text x="506" y="148" font-size="8.5" class="mut">上下文包 3 层 · 4.2k tok · 15:43　✎ 可编辑再发</text>

  <!-- assistant step -->
  <text x="486" y="180" font-size="11" class="t">CI 挂在 <tspan class="mono" font-size="10" fill="#c2410c">checkout.spec.ts:88</tspan>；#7976 把总价计算挪进了异步钩子。</text>
  <text x="486" y="198" font-size="11" class="t">按 <tspan class="mono" font-size="10">dev-flow@v3</tspan> 走：定位 → 复现 → 修复 → 验证。</text>

  <!-- one-run card -->
  <rect x="486" y="212" width="470" height="150" rx="8" fill="#ffffff" stroke="#b8d4c2"/>
  <rect x="486" y="212" width="4" height="150" fill="#2a6a3e"/>
  <text x="500" y="232" font-size="10.5" font-weight="600" class="t">run 01HQZ…　dev-flow@v3</text>
  <rect x="880" y="220" width="62" height="16" rx="8" fill="#eef4f0"/>
  <text x="911" y="232" font-size="9" text-anchor="middle" class="mut">进行中</text>

  <text x="500" y="254" font-size="10" class="mut">定位 <tspan fill="#2a6a3e">✓</tspan> 1.2s　复现 <tspan fill="#2a6a3e">✓</tspan> 3.4s　修复 <tspan fill="#2563eb">●</tspan>　验证 <tspan class="dim">○</tspan></text>
  <rect x="500" y="262" width="440" height="6" rx="3" fill="#eef4f0"/>
  <rect x="500" y="262" width="180" height="6" rx="3" fill="#2a6a3e"/>

  <text x="500" y="288" font-size="10" class="mut">产出：</text>
  <rect x="534" y="278" width="132" height="16" rx="4" fill="#f4f9f5"/>
  <text x="600" y="290" font-size="9" text-anchor="middle" class="mono" fill="#2d3a31">patch 2 files (+18 −7)</text>
  <text x="678" y="290" font-size="9" class="dim">· 1.8k tok · $0.004</text>

  <rect x="500" y="308" width="86" height="26" rx="6" fill="#2a6a3e"/>
  <text x="543" y="325" font-size="10.5" text-anchor="middle" fill="#ffffff">打开 patch</text>
  <rect x="594" y="308" width="94" height="26" rx="6" fill="#ffffff" stroke="#b8d4c2"/>
  <text x="641" y="325" font-size="10.5" text-anchor="middle" fill="#2a6a3e">回写票状态</text>
  <rect x="696" y="308" width="86" height="26" rx="6" fill="#ffffff" stroke="#dbe7df"/>
  <text x="739" y="325" font-size="10.5" text-anchor="middle" class="mut">新建待办</text>
  <rect x="790" y="308" width="76" height="26" rx="6" fill="#ffffff" stroke="#dbe7df"/>
  <text x="828" y="325" font-size="10.5" text-anchor="middle" class="mut">继续问</text>

  <text x="500" y="352" font-size="8.5" class="dim">卡片活在 session log 里：可回放、可 fork、换机也在</text>

  <!-- tool view card -->
  <rect x="486" y="376" width="470" height="60" rx="8" fill="#ffffff" stroke="#dbe7df"/>
  <rect x="486" y="376" width="4" height="60" fill="#7a9c88"/>
  <text x="500" y="396" font-size="10" class="mono" fill="#2d3a31">gh pr diff #7976</text>
  <text x="500" y="412" font-size="9" class="mono" fill="#2a6a3e">+ const total = await calc(cart)</text>
  <text x="500" y="426" font-size="9" class="mono" fill="#c2410c">- const total = calc(cart)</text>
  <text x="880" y="396" font-size="9" class="dim">工具调用卡片</text>

