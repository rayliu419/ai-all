  <text x="36" y="166" font-size="9" class="dim">建票 · PR · 代码 · <tspan fill="#c2410c">CI</tspan> · PERM · 测试</text>

  <rect x="36" y="184" width="112" height="28" rx="6" fill="#2a6a3e"/>
  <text x="92" y="202" font-size="11" text-anchor="middle" fill="#ffffff">看看怎么修</text>
